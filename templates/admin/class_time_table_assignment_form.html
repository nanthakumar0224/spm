    <style>
        #classScheduleForm {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 100%;
            overflow-x: auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: inline-block;
            width: 23%;
            margin-right: 2%;
            vertical-align: top;
        }

        .form-group:last-child {
            margin-right: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }

        .select-box, .input-box {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .select-box {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
        }

        .table-container {
            margin: 2rem 0;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border: 1px solid #ddd;
            min-width: 120px;
        }

        th {
            background-color: #f5f7fa;
            font-weight: 600;
        }

        .day-input {
            width: 100%;
            padding: 0.75rem;
            border: none;
            background: transparent;
            font-weight: 500;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
        }

        .submit-btn:hover {
            background-color: var(--primary-dark);
        }

        .clear-btn {
            background-color: #f1f1f1;
            color: var(--dark);
        }

        .clear-btn:hover {
            background-color: #e1e1e1;
        }

        .footer {
            background: black;
            color: white;
            padding: 2rem;
            text-align: center;
            margin-top: auto;
            font-size: 1.1rem; 
        }

        .copyright {
            font-weight: 500;
        }

        @media (max-width: 1200px) {
            .form-group {
                width: 48%;
                margin-right: 2%;
            }
            
            .form-group:nth-child(2n) {
                margin-right: 0;
            }
        }


    </style>
</head>

    <div class="main-content">
        <form id="classScheduleForm">
            <div class="form-group">
            
                <label for="department">Department</label>
                <select id="department" name="department" class="select-box" required>
                    <option value="">Select Department</option>
                    <option value="computer_science">Computer Science</option>
                    <option value="electronics">Electronics</option>
                    <option value="mechanical">Mechanical</option>
                    <option value="civil">Civil</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <select id="year" name="year" class="select-box" required>
                    <option value="year">Select Year</option>
                    <option value="year">First Year</option>
                    <option value="year">Second Year</option>
                    <option value="year">Third Year</option>
                    <option value="year">Fourth Year</option>
                </select>
            </div>

            <div class="form-group">
            
                <label for="semester">Semester</label>
                <select id="semester" name="semester" class="select-box" required>
                    <option value="semester">Select Semester</option>
                    <option value="semester">1</option>
                    <option value="semester">2</option>
                    <option value="semester">3</option>
                    <option value="semester">4</option>
                    <option value="semester">5</option>
                    <option value="semester">6</option>
                </select>
            </div>

            <div class="form-group">
                <label for="classname">Class Name</label>
                <input type="text" id="classname" name="classname" class="input-box" placeholder="Enter Class Name" required>
            </div>

            <div class="form-group">
                <label for="classid">Class ID</label>
                <input type="number" id="classid" name="classid" class="input-box" placeholder="Enter Class ID" required>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Days</th>
                            <th>P1</th>
                            <th>S1</th>
                            <th>P2</th>
                            <th>S2</th>
                            <th>P3</th>
                            <th>S3</th>
                            <th>P4</th>
                            <th>S4</th>
                            <th>P5</th>
                            <th>S5</th>
                            <th>P6</th>
                            <th>S6</th>
                            <th>P7</th>
                            <th>S7</th>
                            <th>P8</th>
                            <th>S8</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <input type="text" class="day-input" value="Monday" readonly>
                            </td>
                            <!-- Replace all the static select boxes in your table with this pattern -->
                            <td>
                                <select class="select-box subject-select" required>
                                    <option value="">Select Subject</option>
                                    {% for subject in subjects %}
                                        <option value="{{ subject.subjectid }}" data-dept="{{ subject.dept }}">
                                            {{ subject.subjectname }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td>
                                <select class="select-box staff-select" required>
                                    <option value="">Select Staff</option>
                                    {% for staff in staffs %}
                                        <option value="{{ staff.userid }}" data-dept="{{ staff.dept }}">
                                            {{ staff.username }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </td>
                            
                        </tr>

                        <!-- Tuesday -->
                        <tr>
                            <td>
                                <input type="text" class="day-input" value="Tuesday" readonly>
                            </td>
                            <!-- Replace all the static select boxes in your table with this pattern -->
                            <td>
                                <select class="select-box subject-select" required>
                                    <option value="">Select Subject</option>
                                    {% for subject in subjects %}
                                        <option value="{{ subject.subjectid }}" data-dept="{{ subject.dept }}">
                                            {{ subject.subjectname }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td>
                                <select class="select-box staff-select" required>
                                    <option value="">Select Staff</option>
                                    {% for staff in staffs %}
                                        <option value="{{ staff.userid }}" data-dept="{{ staff.dept }}">
                                            {{ staff.username }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </td>
                        </tr>

                        <!-- Thursday -->
                        <tr>
                            <td>
                                <input type="text" class="day-input" value="Thursday" readonly>
                            </td>
                            <!-- Replace all the static select boxes in your table with this pattern -->
                            <td>
                                <select class="select-box subject-select" required>
                                    <option value="">Select Subject</option>
                                    {% for subject in subjects %}
                                        <option value="{{ subject.subjectid }}" data-dept="{{ subject.dept }}">
                                            {{ subject.subjectname }}
                                        </option>

                            </td>
                            <td>

                            </td>
                        </tr>

                        <!-- Friday -->

                            <td>
                                <input type="text" class="day-input" value="Friday" readonly>
                            </td>
                            <!-- Replace all the static select boxes in your table with this pattern -->
                            <td>
                                <select class="select-box subject-select" required>
                                    <option value="">Select Subject</option>
                                    {% for subject in subjects %}
                                        <option value="{{ subject.subjectid }}" data-dept="{{ subject.dept }}">
                                            {{ subject.subjectname }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </td>
                            <td>
                                <select class="select-box staff-select" required>
                                    <option value="">Select Staff</option>
                                    {% for staff in staffs %}
                                        <option value="{{ staff.userid }}" data-dept="{{ staff.dept }}">
                                            {{ staff.username }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="buttons">
                <button type="submit" class="btn submit-btn">Submit</button>
                <button type="reset" class="btn clear-btn">Clear</button>
            </div>
        </form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const departmentSelect = document.getElementById('department');
        const subjectSelects = document.querySelectorAll('.subject-select');
        const staffSelects = document.querySelectorAll('.staff-select');
        
        // Function to filter options based on department
        function filterOptions() {
            const selectedDept = departmentSelect.value;
            
            // Filter subjects
            subjectSelects.forEach(select => {
                const options = select.querySelectorAll('option');
                options.forEach(option => {
                    if (option.value === "" || option.dataset.dept === selectedDept) {
                        option.style.display = '';
                    } else {
                        option.style.display = 'none';
                    }
                });
                // Reset to default option
                select.value = "";
            });
            
            // Filter staff
            staffSelects.forEach(select => {
                const options = select.querySelectorAll('option');
                options.forEach(option => {
                    if (option.value === "" || option.dataset.dept === selectedDept) {
                        option.style.display = '';
                    } else {
                        option.style.display = 'none';
                    }
                });
                // Reset to default option
                select.value = "";
            });
        }
        
        // Initial filter on page load
        filterOptions();
        
        // Filter when department changes
        departmentSelect.addEventListener('change', filterOptions);
    });
    </script>
